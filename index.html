const DATA={"en":{"brand":"Sleep & Rest Toolkit","tag":"Small changes for better nights","title":"Less pressure.\nMore room for rest.","intro":"Sleep can become difficult when nights turn into a test. Explore small, workable changes for your days, your nights, and the moments in between.","badge":"SLEEP • REST • RECONNECT","start":"Find a starting point","startSub":"What feels most familiar right now? Choose one to see a suggestion. This is a guide, not an assessment.","concerns":[["Racing thoughts","My mind gets louder at bedtime.","Try the thought notebook, then a gentle grounding practice. You do not have to solve everything tonight.","thoughts"],["Awake in bed","I lie awake, trying harder to sleep.","Read about the sleep-pressure loop and rebuilding the bed–sleep connection. Choose a plan with your therapist rather than switching strategies repeatedly overnight.","learn"],["Disturbing dreams","Nightmares make sleep feel unsafe.","Start with orienting to the room after waking. If it feels manageable, explore changing a dream with support.","dreams"],["Hard mornings","I feel stuck, groggy, or depleted.","Try the morning anchor: notice, move gently, and take one small step out of bed.","morning"],["Unsteady routines","My days and nights feel out of sync.","Choose a realistic wake-up anchor and one daytime habit. Track a week before making bigger changes.","habits"]],"nav":["Understand","Daily habits","Rest practices","Thoughts","Dreams","Mornings","Sleep diary","My plan"],"theme":"Dark mode","light":"Light mode","print":"Print / PDF","menu":"Explore","top":"Back to top","skip":"Skip to content","learnTitle":"Understand your sleep","learnSub":"Better sleep starts with understanding the system, not grading each night.","learnCards":[["Two systems, one night","Your body clock responds to light and daily timing. Sleep pressure builds while you are awake and eases during sleep. A steady wake-up time, daylight, and daytime movement help these systems work together."],["Sleep changes through the night","Sleep moves through light non-REM sleep (N1 and N2), deep non-REM sleep (N3), and REM sleep. Cycles vary; they are not precise 90-minute timers. Brief awakenings can be normal, and dreams can happen outside REM."],["Enough, rather than perfect","Most adults need about 7–9 hours. Needs vary, and sleep often becomes lighter with age. Notice daytime functioning as well as hours slept. Persistent exhaustion or frequent disruption deserves a review, even if you spend enough time in bed."],["Why insomnia can persist","Sensitivity to stress can set the stage; illness, a loss, work pressure, pain, or a new baby can trigger difficulty. Long lie-ins, worry, and extended wakefulness in bed can then keep the pattern going. This is a learned loop, not a personal failure."],["The pressure loop","A difficult night → predicting disaster tomorrow → checking the clock and trying to force sleep → more alertness. You can interrupt this loop by noticing the prediction, dropping the struggle, and choosing one supportive action."],["What treatment can offer","CBT-I combines behavioral changes with work on sleep-related thoughts and is a first-line treatment for persistent insomnia. Acceptance-based skills can help reduce the struggle with thoughts and feelings. Sleep hygiene alone may not resolve chronic insomnia."]],"approachTitle":"When you are awake in bed","approach":[["Rebuild the bed–sleep connection","In a CBT-I plan, go to bed when sleepy and keep the bed mainly for sleep and intimacy. If you are clearly awake or getting frustrated for roughly 15–20 minutes, move to a safe, dimly lit spot and do something quiet. Return when sleepy; repeat as needed. Estimate instead of watching the clock. If moving is unsafe or difficult, adapt the plan with your clinician."],["Make room for wakefulness","You can notice a thought or sensation without arguing with it. Gently feel the mattress, let your breathing find its own pace, and offer yourself kindness. Rest can ease the struggle, but it does not replace the sleep your body needs. If extended wakefulness becomes a battle, use your agreed out-of-bed plan."],["Keep the approaches coherent","You can use acceptance skills during a CBT-I plan without turning the bed into a place for hours of wakeful activity. If your clinician uses a different acceptance-based approach, agree together on when to stay resting and when to get up. Avoid treating either approach as a rule you must perform perfectly."],["Sleep-window treatment needs guidance","Sleep restriction or compression uses diary patterns to match time in bed more closely to sleep, then adjusts it gradually. It can initially increase sleepiness. This toolkit does not prescribe a shorter sleep window. Work with a qualified clinician, especially with bipolar disorder, seizures, suspected sleep apnea, significant sleepiness, pregnancy, or safety-sensitive work. Never drive while drowsy."]],"habitsTitle":"Small habits, steady rhythm","habitsSub":"Choose one or two experiments for this week. Add them to your plan; there is no score to chase.","habits":[["Wake-up anchor","Get up at a realistic, similar time each day, including weekends. After a rough night, avoid large shifts unless your clinician advises otherwise. Keep enough opportunity for sleep."],["Morning daylight","Open the curtains and spend some time outdoors after waking when possible. Daylight helps your body clock. Ask a clinician before using a bright-light therapy device."],["Daytime movement","Try walking, stretching, or another activity you enjoy. If vigorous late exercise makes you more alert, move it earlier. Adapt activity to your health and abilities."],["Caffeine and nicotine","Caffeine can affect sleep for many hours. Experiment with an earlier cutoff, such as early afternoon, and note your sensitivity. Tea, chocolate, energy drinks, and some medicines also contain caffeine. Nicotine can be stimulating."],["Alcohol and other substances","Alcohol may make you sleepy at first but can fragment later sleep. Avoid using it as a sleep aid. Discuss cannabis, substances, or withdrawal concerns with your healthcare provider."],["Naps with intention","If naps make nights harder, reduce or avoid them. If you need a nap, try keeping it brief (about 20–30 minutes) and earlier in the day. Safety and medical advice come first."],["A gentler last hour","Lower bright light and put work, bills, news, and difficult conversations aside when possible. Try a warm shower, a quiet book, or calming music. Screen brightness and engaging content can both keep you alert."],["A comfortable room","Keep the room dark, quiet, and comfortably cool. Try earplugs, an eye mask, or gentle background sound if helpful. Choose supportive bedding and reduce interruptions."],["Food and fluids","Avoid a heavy meal close to bedtime if it disrupts sleep or causes reflux. A light snack is fine if hungry. Adjust evening fluids for nighttime bathroom trips without dehydrating yourself."],["A kinder relationship with the bed","Keep work, scrolling, and clock checking out of bed. Give yourself permission to stop testing whether you are sleepy. Use the approach you have agreed with your therapist."]],"add":"Add to my plan","added":"Added to plan","calmTitle":"Practise resting, without a target","calmSub":"Read a practice once, then put the screen aside. You can stop or keep your eyes open at any point.","practices":[["Evening anchor",[["Acknowledge","Notice what is here: worry, tiredness, tension, or a busy mind. Try: “This is a difficult moment.” You do not have to clear your mind."],["Connect","Feel the support beneath your body and the contact of the pillow or chair. Notice the gentle movement of natural breathing, without changing it."],["Engage","Notice a neutral sound or the texture of the blanket. Return gently when your mind wanders. There is no need to check whether the exercise is working."]]],["Body scan",[["Arrive","Choose a supported position. Feel where your body meets the surface beneath you. Eyes open or closed—your choice."],["Notice","Move attention slowly from feet and legs to hips, hands, shoulders, and face. Notice warmth, pressure, tingling, or no clear sensation. Nothing needs to change."],["Widen","Allow your attention to include the whole body. If body awareness feels uncomfortable, focus on the room or a steady sound instead."]]],["Gentle muscle release",[["Prepare","Try this in the daytime first. Skip painful or injured areas. Breathe normally; do not hold your breath or strain."],["Release","Start with hands or feet. Gently tense for about 3–5 seconds, then release for 10–20 seconds. Continue with legs, shoulders, and face if comfortable."],["Notice the difference","Notice tension and ease without demanding total relaxation. If tensing hurts or adds pressure, simply notice each body area and let it be."]]],["Comfortable breathing",[["Settle","Sit comfortably. Breathe gently at your own pace. No breath holds, deep forced breaths, or exact counts are needed."],["Optional alternate nostrils","If comfortable and unblocked: gently close the right nostril, breathe in through the left, switch and breathe out through the right. Breathe in on the right, switch, and breathe out on the left. Repeat a few easy cycles. Ordinary breathing is equally welcome."],["Finish","Return to natural breathing. Stop if dizzy, congested, short of breath, or uncomfortable. This is an optional attention practice, not a way to switch brain hemispheres or control sleep cycles."]]],["A quiet scene",[["Choose","Picture an ordinary place that feels pleasant or neutral: a shaded path, a familiar chair, or a quiet room. If imagery is difficult, use words or a gentle sound instead."],["Explore","Notice a few colors, sounds, textures, or the sense of support. Let details be loose rather than trying to construct a perfect picture."],["Let it be","When thoughts arrive, acknowledge them and return if you wish. Resting attention is the practice; sleep is not a result you have to produce."]]],["Kindness and gratitude",[["Acknowledge","Notice one difficult part of today without judging how you coped. You can say: “Of course this feels hard.”"],["Offer care","If welcome, rest a hand somewhere comfortable. Try: “May I be gentle with myself tonight.” There is no requirement to feel calm or positive."],["Notice one thing","Recall one ordinary moment you appreciated, or one small action you took in line with what matters. If gratitude feels forced, skip it and stay with kindness."]]],["Guided rest",[["Settle into support","Lie or sit in a position that feels comfortable and supported. This waking rest practice is sometimes called yoga nidra. It does not replace sleep."],["Move attention gently","Notice the right hand, left hand, feet, and the places where your body meets the surface. Stay aware of the room if closing your eyes feels uncomfortable."],["Return without a test","Let attention move between the body and sounds around you. When you finish, take a moment before moving. You do not need to feel different for the pause to count."]]]],"next":"Next step","previous":"Previous","restart":"Start again","step":"Step","breakTitle":"A pause during the day","breakText":"Energy and attention naturally fluctuate. Between tasks, take a brief pause: look away, stretch if comfortable, breathe normally, and notice what you need next. There is no need to time a precise 90–120 minute rhythm or infer your brain state from your nostrils.","thoughtsTitle":"Give your thoughts somewhere to land","thoughtsSub":"Use this in the daytime or early evening. At night, a short reminder is enough.","thoughtGuide":[["Notice a thought","“I’m having the thought that tomorrow will be impossible.” Adding these words creates a little space; you do not have to prove the thought wrong."],["Find a balanced response","Try: “Tomorrow may be harder, and I can reduce demands and ask for support.” Aim for believable language rather than forced positive thinking."],["Set a daytime worry appointment","Choose 10–20 minutes earlier in the day. Write what is troubling you and one practical next step, or acknowledge what you cannot solve now. When it returns at night: “This matters, and I can return to it at my planned time.”"],["Return to what matters","A difficult night can shrink the next day. Choose one manageable action for connection, health, or something meaningful, while adjusting demands to your energy."]],"thoughtFields":[["thought","A thought keeping me awake"],["response","A believable, kinder response"],["worrytime","My daytime worry appointment"],["action","One small next step"]],"example":"Try an example","exampleText":["If I do not sleep perfectly, tomorrow will be a disaster.","I may be tired. I can simplify tomorrow, take breaks, and ask for help. One night is not the whole picture."],"dreamsTitle":"After a difficult dream","dreamsSub":"You do not need to decode a dream or relive every detail to work with it.","dreamIntro":"First orient: look around, name where you are and today’s date, feel the support under you, and notice that you are awake now. Use a gentle light if helpful. Choose what helps you feel steadier before considering more practice.","dreamSteps":[["Choose gently","In daytime, choose a manageable dream or just a brief theme. Start with something less distressing. You may skip writing the original dream entirely."],["Change the story","Create a version with more safety, choice, help, or a different ending. It does not have to be realistic. A door can appear; you can leave; someone can help."],["Rehearse the new version","If comfortable, imagine or read the changed story for a few minutes during the day. Focus on the new version, not repeated exposure to the frightening one."],["Review with support","Notice frequency, distress, and any changes over time. If this brings flashbacks, dissociation, panic, or more distress, stop, orient to the room, and work with a trauma-informed clinician. Recurrent nightmares deserve care."]],"dreamFields":[["theme","Optional: a short dream theme"],["newdream","My changed story: more safety, choice, or support"],["rehearsal","When and how I will practise"]],"dreamPrompt":"Need an idea?","dreamIdeas":["A helper arrives and stays with me.","I find a door that opens into a peaceful place.","The threat becomes small and harmless.","I can speak, move, and choose to leave."],"dreamNote":"Dream symbols do not have fixed scientific meanings. Personal associations can be explored with curiosity, without treating a dream as a diagnosis or prediction.","morningTitle":"A softer way into the morning","morningSub":"Grogginess after waking can happen. You do not have to feel ready before taking a tiny step.","morningSteps":[["Notice","“Here is tiredness. Here is worry.” Name the experience without calling yourself lazy or failing."],["Move gently","Wiggle fingers and toes, stretch within comfort, or press your feet lightly into the mattress. Adapt to pain and mobility needs."],["Connect to the room","Notice a few things you can see and hear. Sit up slowly; if dizzy, pause and seek advice if it persists."],["Feet on the floor","When safe, bring your feet to the floor and stand with support if needed. Avoid rolling toward the edge or risking a fall."],["Choose one welcoming action","Use a pleasant alarm, open the curtains, have water or breakfast, or play gentle music. Prepare something to look forward to. Protect sleep time rather than waking earlier just to be productive."]],"diaryTitle":"Notice patterns, one morning at a time","diarySub":"Estimate once in the morning; no nighttime clock checking needed. Use the evening notes to track your day. Seven entries are a starting point—bring a longer diary if your clinician asks.","privacy":"Your entries stay in this page unless you choose “Remember on this device.” Nothing is sent to a server. Avoid names or identifying details on shared devices. Downloads and printed copies contain what you enter.","remember":"Remember on this device","rememberHint":"Optional. Turning this off removes this site’s saved entries from this browser. Private browsing may not retain data.","saved":"Saved on this device","session":"Kept in this page only","saveFailed":"Device storage is unavailable. Entries remain in this page; export before closing.","day":"Entry","morningLabel":"Morning estimate","eveningLabel":"Daytime & evening notes","diaryFields":[["date","Morning date","date"],["bed","Got into bed","time"],["rise","Got out of bed","time"],["latency","Minutes to fall asleep","number"],["awake","Total awake minutes after first falling asleep (include final wakefulness before getting up)","number"],["wakes","Number of awakenings","number"],["quality","Sleep quality (1 = very poor, 5 = very good)","quality"],["feeling","How I feel this morning","text"],["barriers","What disrupted sleep? (thoughts, pain, noise, dreams…)","text"],["naps","Nap minutes during the preceding day","number"],["caffeine","Caffeine: amounts and times","text"],["exercise","Movement / exercise minutes","number"],["meds","Medicines or substances (optional)","text"],["drowsy","Daytime drowsiness","drowsy"],["mood","Mood during the day","text"],["beforebed","Activities in the hour before bed","text"],["nightmare","Nightmare distress (0 = none, 10 = extreme)","distress"],["dreamchange","Dream changes / rehearsal (optional)","text"]],"drowsyOptions":["Not recorded","Never","Sometimes","Often"],"choose":"Not recorded","calcNote":"Estimates assume one main sleep period under 24 hours. Time in bed = bed to rise; estimated sleep = time in bed − time to fall asleep − later awake time. Efficiency = estimated sleep ÷ time in bed × 100. If you spent long periods out of bed or have split sleep, note that and review with your clinician. These numbers are not a diagnosis or a target.","metricLabels":["Time in bed","Estimated sleep","Sleep efficiency"],"hours":"h","invalid":"Please check the times and awake minutes; they do not fit this sleep period.","incomplete":"Enter bed and rise times plus both awake-minute fields to see estimates. Use 0 where appropriate.","weekTitle":"Your seven-entry snapshot","weekNote":"Averages use complete, valid entries only. Averages describe this record, not your sleep needs.","complete":"valid entries","emptyDiary":"Your pattern will appear as you add complete entries.","csv":"Export diary CSV","clear":"Clear my entries","confirmClear":"Clear all diary, exercise, and plan entries from this page and this device? This cannot be undone.","planTitle":"Your next small experiment","planSub":"Build a plan you could use on an ordinary, imperfect day. Changes often take weeks; one rough night is not a reset.","planFields":[["wake","My realistic wake-up anchor"],["ritual","My gentle wind-down routine"],["awakeplan","If I am awake and frustrated, I will…"],["value","What better rest would help me make room for"],["review","When I will review this with my therapist"]],"selectedHabits":"My selected habits","noHabits":"Choose a habit above, or start with your own idea below.","roadTitle":"A flexible path with your therapist","road":[["Observe","Start with sleep history, health, medications, mood, and a diary. Discuss pain, snoring, work shifts, and caregiving."],["Adjust","Pick a few workable habits. If appropriate, build a stimulus-control plan and discuss a supervised sleep window."],["Practise","Learn relaxation or noticing skills, explore sleep predictions, and create daytime space for worries."],["Review","Over roughly 6–8 weeks or longer, review the pattern together. Adapt to your context, expect ups and downs, and keep what supports you."]],"helpTitle":"When extra support matters","helpCards":[["Ask for an assessment","Talk with a healthcare professional if sleep problems persist, affect daily life, or happen alongside pain, low mood, anxiety, medication changes, or frequent bathroom trips. Loud snoring, gasping, breathing pauses, restless legs, or acting out dreams also deserve review."],["Put safety first","Do not drive or operate machinery if sleepy. Seek urgent medical advice for very little sleep alongside unusual energy, agitation, racing thoughts, or risky behavior, especially with a history of bipolar disorder."],["Review medicines and supplements","Do not stop prescribed medicine or change doses on your own. Melatonin, sedating antihistamines, herbs, and other supplements can cause side effects or interactions and are not a universal treatment for insomnia. Discuss them with a qualified healthcare professional."]],"disclaimer":"For adult education and reflection. This toolkit does not diagnose sleep disorders or replace individualized medical or psychological care.","sourcesTitle":"Further reading","sourcesLabels":["NIH: insomnia treatment","NIH: adult sleep needs","AASM: behavioral insomnia treatment","AASM: nightmare treatment","NIH: complementary sleep approaches"],"footer":"Developed by Mind X Associates","footerLink":"https://mindx.us/","printNote":"Use your browser’s print dialog to save as PDF. Your completed diary, reflections, and plan are included.","dataNotice":"Download ready. Keep your exported file private.","habitAnnounce":"Plan updated.","chartLabel":"Estimated sleep by entry, in hours","artLabel":"A crescent moon over quiet hills"}};
const IS_ZH=false;

try{if(IS_ZH&&['zh-Hans','zh-Hant'].includes(localStorage.getItem('rest-language')))language=localStorage.getItem('rest-language');const raw=localStorage.getItem(STORE);if(raw){const v=JSON.parse(raw);if(v&&Array.isArray(v.days)&&v.days.length===7&&v.fields&&Array.isArray(v.habits)){state={days:v.days.map(d=>(d&&typeof d==='object')?d:{}),fields:v.fields,habits:v.habits.filter(n=>Number.isInteger(n)&&n>=0&&n<10)};remember=true}}}catch(e){}
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=()=>DATA[language];
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').hidden=true,3200)}
function persist(){try{if(remember){localStorage.setItem(STORE,JSON.stringify(state));$('#saveStatus').textContent=t().saved}else{$('#saveStatus').textContent=t().session}}catch(e){$('#saveStatus').textContent=t().saveFailed}}
function field(key,label,type='textarea',val='',extra=''){let node;if(type==='textarea')node=`<textarea id="${key}" ${extra}>${esc(val)}</textarea>`;else if(['quality','drowsy','distress'].includes(type)){const options=type==='drowsy'?t().drowsyOptions.map((v,i)=>[['','never','sometimes','often'][i],v]):[['',t().choose],...Array.from({length:type==='quality'?5:11},(_,i)=>{let n=type==='quality'?i+1:i;return[n,n]})];node=`<select id="${key}" ${extra}>${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}else node=`<input id="${key}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" max="1440" step="1"':''} ${extra}>`;return`<label class="field" for="${key}"><span>${esc(label)}</span>${node}<span class="print-value">${esc(type==='drowsy'&&val?t().drowsyOptions[['','never','sometimes','often'].indexOf(val)]||val:val)||'—'}</span></label>`}
function section(id,no,title,sub,body){return `<section class="section" id="${id}"><div class="section-head"><span class="section-no" aria-hidden="true">${no}</span><div><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p></div></div>${body}</section>`}
function cards(data,cols=''){return `<div class="grid ${cols}">${data.map(([h,p],i)=>`<article class="card"><span class="index" aria-hidden="true">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('')}</div>`}
function fields(list){return `<div class="field-grid">${list.map(([key,label])=>field('f-'+key,label,'textarea',state.fields[key]||'',`data-field="${key}"`)).join('')}</div>`}
function render(){const d=t();document.documentElement.lang=language;document.title=d.brand+' | '+d.tag;$('#brand').textContent=d.brand;$('#tag').textContent=d.tag;$('#skip').textContent=d.skip;$('#print').textContent=d.print;$('#toTop').setAttribute('aria-label',d.top);$('#footer').textContent=d.footer;$('#footer').href=d.footerLink;$('#printNote').textContent=d.printNote;$('#nav').setAttribute('aria-label',d.menu);$('#nav').innerHTML=ids.map((id,i)=>`<a href="#${id}">${esc(d.nav[i])}</a>`).join('');
$('#language').hidden=!IS_ZH;if(IS_ZH){$('#language').textContent=language==='zh-Hans'?'繁體中文':'简体中文';$('#language').setAttribute('aria-label',language==='zh-Hans'?'切换至繁體中文':'切換至简体中文')};themeLabel();
$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(d.badge)}</div><h1>${esc(d.title)}</h1><p class="intro">${esc(d.intro)}</p><a class="primary" href="#start">${esc(d.start)} <span aria-hidden="true">↗</span></a></div><div class="art" role="img" aria-label="${esc(d.artLabel)}"><div class="star"></div><div class="moon"></div><div class="hill"></div><div class="hill h2"></div><div class="hill h3"></div><div class="art-label">${esc(d.badge)}</div></div></section>
<section class="starter" id="start"><h2>${esc(d.start)}</h2><p class="sub">${esc(d.startSub)}</p><div class="choice-row">${d.concerns.map((c,i)=>`<button type="button" data-concern="${i}" aria-pressed="${i===activeConcern}">${esc(c[0])}</button>`).join('')}</div><div id="recommend" aria-live="polite"></div></section>
${section('learn','01',d.learnTitle,d.learnSub,cards(d.learnCards)+`<div class="aside"><h3>${esc(d.approachTitle)}</h3>${d.approach.map(([h,p])=>`<details><summary>${esc(h)}</summary><div class="detail">${esc(p)}</div></details>`).join('')}</div>`)}
${section('habits','02',d.habitsTitle,d.habitsSub,`<div class="grid">${d.habits.map(([h,p],i)=>`<article class="card habit ${state.habits.includes(i)?'chosen':''}" id="habit-${i}"><span class="index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><h3>${esc(h)}</h3><p>${esc(p)}</p><button type="button" data-habit="${i}" aria-pressed="${state.habits.includes(i)}">${state.habits.includes(i)?'✓ '+esc(d.added):'+ '+esc(d.add)}</button></article>`).join('')}</div>`)}
${section('calm','03',d.calmTitle,d.calmSub,`<div class="tabs" role="tablist" aria-label="${esc(d.nav[2])}">${d.practices.map(([h],i)=>`<button type="button" role="tab" id="practice-tab-${i}" data-practice="${i}" aria-controls="practice-panel" aria-selected="${i===activePractice}" tabindex="${i===activePractice?0:-1}">${esc(h)}</button>`).join('')}</div><div id="practice-panel" class="practice" role="tabpanel" tabindex="0"></div><div class="print-only">${d.practices.map(([h,steps])=>`<article class="print-practice"><h3>${esc(h)}</h3>${steps.map(([a,b])=>`<h4>${esc(a)}</h4><p>${esc(b)}</p>`).join('')}</article>`).join('')}</div><aside class="aside"><h3>${esc(d.breakTitle)}</h3><p>${esc(d.breakText)}</p></aside>`)}
${section('thoughts','04',d.thoughtsTitle,d.thoughtsSub,cards(d.thoughtGuide,'two')+`<div class="form-card"><div class="inline-actions"><button class="text-button" id="example" type="button">${esc(d.example)}</button></div><p id="exampleView" class="quiet" hidden></p>${fields(d.thoughtFields)}</div>`)}
${section('dreams','05',d.dreamsTitle,d.dreamsSub,`<aside class="aside" style="margin-top:0;margin-bottom:24px"><p>${esc(d.dreamIntro)}</p></aside>`+cards(d.dreamSteps,'two')+`<div class="form-card"><div class="inline-actions"><button id="dreamIdea" class="text-button" type="button">${esc(d.dreamPrompt)}</button></div><p id="dreamIdeaView" class="quiet" aria-live="polite" hidden></p>${fields(d.dreamFields)}</div><p class="quiet" style="margin-top:20px">${esc(d.dreamNote)}</p>`)}
${section('morning','06',d.morningTitle,d.morningSub,`<div class="grid">${d.morningSteps.map(([h,p],i)=>`<article class="card"><span class="index" aria-hidden="true">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('')}</div>`)}
${section('diary','07',d.diaryTitle,d.diarySub,`<div class="privacy">${esc(d.privacy)}</div><div class="save-row"><label class="check-label"><input type="checkbox" id="remember" ${remember?'checked':''}>${esc(d.remember)}</label><span class="save-status" id="saveStatus" role="status">${esc(remember?d.saved:d.session)}</span></div><p class="quiet remember-hint">${esc(d.rememberHint)}</p><div class="tabs day-tabs" role="tablist" aria-label="${esc(d.nav[6])}">${Array.from({length:7},(_,i)=>`<button type="button" role="tab" id="day-tab-${i}" data-day="${i}" aria-controls="day-${i}" aria-label="${esc(d.day)} ${i+1}" aria-selected="${i===activeDay}" tabindex="${i===activeDay?0:-1}">${i+1}</button>`).join('')}</div><div id="diaryPanels">${state.days.map((v,i)=>diaryPanel(v,i)).join('')}</div><p class="quiet" style="margin-top:18px">${esc(d.calcNote)}</p><div id="snapshot" class="snapshot"></div><div class="inline-actions"><button type="button" id="csv">${esc(d.csv)}</button><button type="button" id="clear" class="text-button">${esc(d.clear)}</button></div>`)}
${section('plan','08',d.planTitle,d.planSub,`<div class="form-card"><h3>${esc(d.selectedHabits)}</h3><div id="habitList"></div>${fields(d.planFields)}</div><aside style="margin-top:38px"><h3>${esc(d.roadTitle)}</h3><div class="road">${d.road.map(([h,p])=>`<article><h4>${esc(h)}</h4><p>${esc(p)}</p></article>`).join('')}</div></aside><div class="help"><h2>${esc(d.helpTitle)}</h2>${cards(d.helpCards)}<p class="disclaimer">${esc(d.disclaimer)}</p><details class="resources"><summary>${esc(d.sourcesTitle)}</summary><div class="detail sources">${['https://www.nhlbi.nih.gov/health/insomnia/treatment','https://www.nhlbi.nih.gov/health/sleep/how-much-sleep','https://pmc.ncbi.nlm.nih.gov/articles/PMC7853203/','https://pmc.ncbi.nlm.nih.gov/articles/PMC5991964/','https://www.nccih.nih.gov/health/sleep-disorders-and-complementary-health-approaches'].map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">${esc(d.sourcesLabels[i])} ↗</a>`).join('')}</div></details></div>`)}
`;
renderConcern();renderPractice();renderHabits();state.days.forEach((_,i)=>renderMetrics(i));renderSnapshot();bind();}
function diaryPanel(v,i){const d=t();return `<div id="day-${i}" class="diary-card" role="tabpanel" aria-labelledby="day-tab-${i}" tabindex="0" ${i!==activeDay?'hidden':''}><h3>${esc(d.day)} ${i+1}</h3><div class="group-heading">${esc(d.morningLabel)}</div><div class="field-grid">${d.diaryFields.slice(0,9).map(([k,l,type])=>field('d'+i+'-'+k,l,type,v[k]??'',`data-dayfield="${k}" data-entry="${i}"`)).join('')}</div><div id="metrics-${i}"></div><div class="group-heading">${esc(d.eveningLabel)}</div><div class="field-grid">${d.diaryFields.slice(9).map(([k,l,type])=>field('d'+i+'-'+k,l,type,v[k]??'',`data-dayfield="${k}" data-entry="${i}"`)).join('')}</div></div>`}
function calc(v){if(!v.bed||!v.rise||v.latency==null||v.latency===''||v.awake==null||v.awake==='')return {kind:'incomplete'};const time=s=>{if(!/^\d{2}:\d{2}$/.test(s))return NaN;let [h,m]=s.split(':').map(Number);return h<24&&m<60?h*60+m:NaN};let bed=time(v.bed),rise=time(v.rise),inbed=(rise-bed+1440)%1440,latency=Number(v.latency),awake=Number(v.awake);if(!Number.isFinite(inbed)||inbed===0||!Number.isFinite(latency)||!Number.isFinite(awake)||latency<0||awake<0||latency+awake>inbed)return {kind:'invalid'};const sleep=inbed-latency-awake;return{kind:'valid',inbed,sleep,eff:sleep/inbed*100}}
function metricHTML(m){const d=t();return`<div class="metrics">${d.metricLabels.map((l,i)=>`<div class="metric"><strong>${m&&m.kind==='valid'?(i===0?(m.inbed/60).toFixed(1)+' '+d.hours:i===1?(m.sleep/60).toFixed(1)+' '+d.hours:m.eff.toFixed(0)+'%'):'—'}</strong><span>${esc(l)}</span></div>`).join('')}</div>`}
function renderMetrics(i){const m=calc(state.days[i]),el=$('#metrics-'+i);if(el)el.innerHTML=metricHTML(m)+(m.kind!=='valid'?`<p class="calc-message ${m.kind==='invalid'?'error':''}" role="status">${esc(t()[m.kind])}</p>`:'')}
function renderSnapshot(){const d=t(),all=state.days.map(calc),valid=all.filter(m=>m.kind==='valid');let m=null;if(valid.length){const inbed=valid.reduce((a,v)=>a+v.inbed,0),sleep=valid.reduce((a,v)=>a+v.sleep,0);m={kind:'valid',inbed:inbed/valid.length,sleep:sleep/valid.length,eff:sleep/inbed*100}}const max=Math.max(9,...valid.map(v=>v.sleep/60));$('#snapshot').innerHTML=`<h3>${esc(d.weekTitle)}</h3><p class="quiet">${esc(d.weekNote)}</p><p class="quiet">${valid.length} / 7 ${esc(d.complete)}</p>${valid.length?metricHTML(m):`<p class="quiet">${esc(d.emptyDiary)}</p>`}<div class="bars" role="img" aria-label="${esc(d.chartLabel+': '+all.map((m,i)=>(i+1)+' = '+(m.kind==='valid'?(m.sleep/60).toFixed(1):'—')).join(', '))}">${all.map((m,i)=>`<div class="bar-wrap"><span class="bar-value">${m.kind==='valid'?(m.sleep/60).toFixed(1):'—'}</span><div class="bar" style="height:${m.kind==='valid'?Math.max(1,m.sleep/60/max*85):1}%"></div><span class="bar-label">${i+1}</span></div>`).join('')}</div>`}
function renderHabits(){const d=t();$('#habitList').innerHTML=state.habits.length?`<ul class="habit-list">${state.habits.map(i=>`<li>${esc(d.habits[i][0])}</li>`).join('')}</ul>`:`<p class="quiet">${esc(d.noHabits)}</p>`}
function renderConcern(){const c=t().concerns[activeConcern];$('#recommend').innerHTML=c?`<div class="recommend"><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><a href="#${c[3]}">${esc(t().nav[ids.indexOf(c[3])])} ↗</a></div>`:''}
function renderPractice(){const d=t(),p=d.practices[activePractice],s=p[1][activeStep];$('#practice-panel').setAttribute('aria-labelledby','practice-tab-'+activePractice);$('#practice-panel').innerHTML=`<div class="practice-art" aria-hidden="true"></div><div><p class="step-num">${esc(d.step)} ${activeStep+1} / ${p[1].length}</p><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p><div class="step-actions"><button type="button" id="previous" ${activeStep===0?'disabled':''}>← ${esc(d.previous)}</button><button type="button" id="next">${esc(activeStep===p[1].length-1?d.restart:d.next)} ${activeStep===p[1].length-1?'↺':'→'}</button></div></div>`;$('#previous').onclick=()=>{activeStep=Math.max(0,activeStep-1);renderPractice();$('#practice-panel').focus()};$('#next').onclick=()=>{activeStep=(activeStep+1)%p[1].length;renderPractice();$('#practice-panel').focus()}}
function themeLabel(){let dark=document.documentElement.dataset.theme==='dark';$('#theme').textContent=dark?'☀ '+t().light:'☾ '+t().theme;$('#theme').setAttribute('aria-pressed',String(dark))}
function updateMirror(el){el.parentElement.querySelector('.print-value').textContent=(el.tagName==='SELECT'?el.selectedOptions[0]?.textContent:el.value)||'—'}
function tabKeys(selector,attr,activate){const list=$$(selector);list.forEach((b,i)=>b.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%list.length;else if(e.key==='ArrowLeft')n=(i+list.length-1)%list.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=list.length-1;else return;e.preventDefault();activate(Number(list[n].getAttribute(attr)));list[n].focus()}))}
function setPractice(n){activePractice=n;activeStep=0;$$('[data-practice]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===n));b.tabIndex=i===n?0:-1});renderPractice()}
function setDay(n){activeDay=n;$$('[data-day]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===n));b.tabIndex=i===n?0:-1;$('#day-'+i).hidden=i!==n})}
function bind(){$$('[data-concern]').forEach(b=>b.onclick=()=>{activeConcern=Number(b.dataset.concern);$$('[data-concern]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderConcern()});$$('[data-habit]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.habit),selected=state.habits.includes(i);state.habits=selected?state.habits.filter(n=>n!==i):[...state.habits,i];b.setAttribute('aria-pressed',String(!selected));b.textContent=!selected?'✓ '+t().added:'+ '+t().add;b.closest('.habit').classList.toggle('chosen',!selected);renderHabits();persist();notify(t().habitAnnounce)});$$('[data-practice]').forEach(b=>b.onclick=()=>setPractice(Number(b.dataset.practice)));tabKeys('[data-practice]','data-practice',setPractice);$$('[data-day]').forEach(b=>b.onclick=()=>setDay(Number(b.dataset.day)));tabKeys('[data-day]','data-day',setDay);$$('[data-field]').forEach(el=>el.oninput=()=>{state.fields[el.dataset.field]=el.value;updateMirror(el);persist()});$$('[data-dayfield]').forEach(el=>{const changed=()=>{const i=Number(el.dataset.entry);state.days[i][el.dataset.dayfield]=el.value;updateMirror(el);renderMetrics(i);renderSnapshot();persist()};el.addEventListener('input',changed);el.addEventListener('change',changed)});$('#remember').onchange=e=>{remember=e.target.checked;if(!remember){try{localStorage.removeItem(STORE)}catch(e){$('#saveStatus').textContent=t().saveFailed;return}}persist()};$('#example').onclick=()=>{const p=$('#exampleView');p.hidden=!p.hidden;p.textContent=t().exampleText.join(' → ')};let idea=0;$('#dreamIdea').onclick=()=>{const p=$('#dreamIdeaView');p.hidden=false;p.textContent=t().dreamIdeas[idea++%t().dreamIdeas.length]};$('#csv').onclick=exportCSV;$('#clear').onclick=()=>{if(!confirm(t().confirmClear))return;state={habits:[],fields:{},days:Array.from({length:7},()=>({}))};try{localStorage.removeItem(STORE)}catch(e){}remember=false;render()}}
function exportCSV(){const d=t();const keys=d.diaryFields.map(f=>f[0]),headers=d.diaryFields.map(f=>f[1]);headers.push(d.metricLabels[0]+' ('+d.hours+')',d.metricLabels[1]+' ('+d.hours+')',d.metricLabels[2]+' (%)');const rows=state.days.map(v=>{const m=calc(v);return[...keys.map(k=>k==='drowsy'&&v[k]?d.drowsyOptions[['','never','sometimes','often'].indexOf(v[k])]||v[k]:v[k]??''),...(m.kind==='valid'?[(m.inbed/60).toFixed(2),(m.sleep/60).toFixed(2),m.eff.toFixed(1)]:['','',''])]});const safe=v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\uFEFF'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='sleep-diary.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(d.dataNotice)}
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('rest-theme',dark?'dark':'light')}catch(e){}themeLabel()};$('#language').onclick=()=>{const y=scrollY;language=language==='zh-Hans'?'zh-Hant':'zh-Hans';try{localStorage.setItem('rest-language',language)}catch(e){}render();window.scrollTo({top:y,behavior:'instant'});$('#language').focus({preventScroll:true})};$('#toTop').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
let printDetails=[];function preparePrint(){printDetails=$$('details').map(el=>[el,el.open]);printDetails.forEach(([el])=>el.open=true)}function afterPrint(){printDetails.forEach(([el,open])=>el.open=open);printDetails=[]}window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',afterPrint);$('#print').onclick=()=>window.print();
render();
</script></body></html>
