const DATA={"zh-Hans":{"brand":"慢慢安睡","tag":"给自己一份安睡指南","title":"少一点用力，\n多一点安睡的空间。","intro":"当每晚都变成一场“必须睡好”的考验，休息也会让人紧绷。在这里，从白天、夜晚和醒来的片刻开始，找到适合自己的小改变。","badge":"睡眠 · 休息 · 重新连接","start":"找到适合我的起点","startSub":"现在，你更接近哪种状态？选一项，看看可以从哪里开始。这只是使用指引，不是诊断或评估。","concerns":[["脑子停不下来","一到晚上，想法反而更多。","先用想法记录本把担忧安放下来，再试试温和的着陆练习。你不需要今晚就把所有问题解决。","thoughts"],["躺着睡不着","越想赶快睡着，越清醒。","了解“用力入睡”的循环，以及怎样重新建立床与睡眠的联系。和咨询师商量一套方案，避免半夜反复切换方法。","learn"],["噩梦困扰","担心做噩梦，连睡觉也不踏实。","醒来后先确认自己身在何处，重新感受当下。如果状态允许，可以在支持下尝试改写梦境。","dreams"],["早晨起不来","昏沉、疲惫，或迟迟无法起身。","试试晨间着陆练习：觉察、轻轻活动，再完成一个很小的起床动作。","morning"],["作息不稳定","白天和晚上的节奏有些乱。","先选一个可行的起床时间，再调整一项白天的习惯。观察一周，不急着大幅改变。","habits"]],"nav":["认识睡眠","日常习惯","安顿身心","梳理想法","梦与噩梦","温和起床","睡眠日记","我的计划"],"theme":"深色模式","light":"浅色模式","print":"打印 / PDF","menu":"浏览内容","top":"回到顶部","skip":"跳到正文","learnTitle":"先理解睡眠，不急着纠正自己","learnSub":"理解身体怎样调节睡眠，比给每晚打分更有帮助。","learnCards":[["身体时钟与睡眠压力","生物钟会受到光照和日常作息的影响；睡眠压力则在清醒时逐渐积累，睡着后慢慢下降。相对稳定的起床时间、白天的自然光和适量活动，有助于两者配合。"],["一晚并不是一种睡眠","睡眠会在非快速眼动睡眠的浅睡期（N1、N2）、深睡期（N3）和快速眼动睡眠（REM）之间变化。每个周期长短不一，不能按“精确90分钟”计算。短暂醒来很常见，梦也不只发生在REM期。"],["够用，比完美更重要","大多数成年人每晚需要约7至9小时睡眠，具体需求因人而异。随着年龄增长，睡眠可能变浅。除了时长，也关注白天的状态；即使卧床时间足够，持续疲惫或频繁醒来也值得就医评估。"],["失眠为什么会持续","对压力较敏感可能是基础；疾病、失落、工作压力、疼痛或照顾新生儿，可能成为诱因。之后，长时间赖床、担忧和清醒地躺在床上，可能让困难持续。这是形成了一个循环，不代表你做得不够好。"],["越努力，越清醒的循环","一晚没睡好 → 预想明天一定很糟 → 看时间、强迫入睡 → 更加警觉。试着觉察这个预测，放下与睡眠的较劲，再选择一个能支持自己的行动。"],["治疗能提供什么","失眠认知行为治疗（CBT-I）结合行为调整和对睡眠想法的梳理，是持续性失眠的一线治疗。接纳取向的方法可以帮助减少与想法、情绪的纠缠。单靠“睡眠卫生”常常不足以改善慢性失眠。"]],"approachTitle":"躺着睡不着时，可以怎样做","approach":[["重新建立床与睡眠的联系","在CBT-I方案中，有睡意再上床，尽量把床留给睡眠和亲密活动。如果明显清醒或烦躁了大约15至20分钟，可以到安全、光线柔和的地方做些安静的事，有睡意后再回床，必要时重复。不必盯着钟计时。若起身不安全或行动不便，请与治疗师一起调整。"],["允许清醒暂时存在","看见一个想法或身体感受，不必马上反驳或消除它。轻轻感受床垫的支撑，让呼吸保持自然，给自己一点体谅。休息有助于减少挣扎，但不能替代身体需要的睡眠。如果长时间清醒开始变成煎熬，就使用事先商量好的离床方案。"],["让方法彼此配合","进行CBT-I时，也可以练习接纳，而不必把床变成长时间清醒活动的地方。如果治疗师采用另一种接纳取向方案，请一起约定何时安静休息、何时起身。两种方法都不需要被执行成“必须完美遵守”的规则。"],["睡眠窗口需要专业指导","睡眠限制或压缩治疗，会参考日记，让卧床时间更贴近实际睡眠，再逐步调整。初期可能更困倦。本工具不会自行开出缩短卧床时间的方案。请在专业人员指导下进行；有双相障碍、癫痫、疑似睡眠呼吸暂停、明显嗜睡、孕期或从事高风险工作时，更需要个别评估。困倦时不要驾车。"]],"habitsTitle":"用小习惯，慢慢稳住节奏","habitsSub":"这一周先试一两项就好。加入你的计划，不需要追求满分。","habits":[["给起床时间一个锚点","选择现实可行的起床时间，周末也尽量接近。没睡好后，除非专业人员另有建议，尽量避免大幅推迟。也要给自己留出足够的睡眠机会。"],["早晨接触自然光","醒来后拉开窗帘，条件允许时到户外待一会儿。白天的自然光有助于调整生物钟。使用强光治疗设备前，请先咨询专业人员。"],["白天适度活动","散步、伸展，或做一种你喜欢的活动。如果晚间剧烈运动会让你兴奋，就试着提前。活动量应符合身体状况和行动能力。"],["留意咖啡因和尼古丁","咖啡因的影响可能持续很多小时。试着把最后一次摄入提前，比如放在午后早些时候，并观察自己的敏感程度。茶、巧克力、能量饮料和部分药物也含咖啡因。尼古丁也可能让人更清醒。"],["酒精及其他物质","酒精可能让人一开始犯困，却打断后半夜的睡眠。尽量不要靠它助眠。若涉及大麻、其他物质或戒断困扰，请与医疗人员讨论。"],["有意识地安排午睡","如果午睡影响夜间睡眠，可以减少或避免。确实需要时，试着控制在约20至30分钟，并安排在白天较早的时候。安全和个别医疗建议优先。"],["让睡前一小时慢下来","调暗明亮的灯光，尽可能放下工作、账单、新闻和困难的对话。试试温水淋浴、安静的阅读或舒缓音乐。屏幕亮度和令人投入的内容，都可能让大脑保持兴奋。"],["让卧室舒服一点","尽量保持黑暗、安静和舒适偏凉。必要时使用耳塞、眼罩或轻柔背景声。选择有支撑、睡着舒服的寝具，减少打扰。"],["照顾饮食与饮水","如果大餐容易影响入睡或引起反流，尽量别安排在临睡前。饿了可以吃少量点心。夜间常起床上厕所时，可调整晚间饮水，但不必让自己缺水。"],["让床少一点任务感","把工作、刷手机和反复看时间尽量移出床外。不必持续测试“我有没有睡意”。采用你与咨询师商量好的方案。"]],"add":"加入我的计划","added":"已加入计划","calmTitle":"练习休息，不把入睡当任务","calmSub":"先看一遍，再放下屏幕。你可以随时停下，也可以全程睁眼。","practices":[["晚间着陆",[["承认此刻的体验","看看现在有什么：担忧、疲惫、紧张，或不断冒出的想法。可以说：“这一刻有点难。”不需要清空大脑。"],["感受身体的支撑","感受床垫、枕头或椅子托住身体的地方。留意自然呼吸带来的轻微起伏，不必改变它。"],["回到当下","注意一个平常的声音，或被子的触感。走神后轻轻回来就好，不必检查练习“有没有起效”。"]]],["身体扫描",[["安顿下来","找到有支撑的姿势，感受身体与下方表面的接触。睁眼或闭眼，由你决定。"],["逐处觉察","从脚和腿，慢慢移到髋部、双手、肩膀和脸。注意温度、压力、轻微麻感，或没有明显感觉，都可以。什么都不需要改变。"],["扩大注意范围","让注意力轻轻覆盖全身。如果关注身体让你不舒服，可以改为观察房间，或听一个稳定的声音。"]]],["温和的肌肉放松",[["做好准备","先在白天练习。跳过疼痛或受伤的部位。保持自然呼吸，不憋气，也不需要用力。"],["轻轻松开","从手或脚开始，轻微绷紧约3至5秒，再松开10至20秒。舒服的话，继续到腿、肩膀和面部。"],["体会差别","观察紧与松的区别，不要求彻底放松。如果绷紧会疼或增加压力，只需依次觉察身体，让感觉暂时存在。"]]],["舒适的呼吸",[["坐稳","舒服地坐着，按自己的节奏轻柔呼吸。不必屏息、用力深呼吸，也不需要数到规定的秒数。"],["可选：交替鼻孔呼吸","鼻腔通畅且感觉舒适时：轻轻闭住右侧，从左侧吸气；换边，从右侧呼气。再从右侧吸气，换边从左侧呼气。这样完成一轮，轻松重复几轮即可。普通呼吸也完全可以。"],["结束","恢复自然呼吸。头晕、鼻塞、气短或不舒服时立即停止。这只是可选的注意力练习，不是切换左右脑或控制睡眠周期的方法。"]]],["一处安静的场景",[["选择场景","想象一个让你觉得舒服或平和的地方：树荫下的小路、熟悉的椅子、一间安静的房间。不擅长想象时，可以使用文字描述或轻柔的声音。"],["慢慢感受","留意一些颜色、声音、质地，或被支撑的感觉。画面可以很模糊，不必努力构建“完美场景”。"],["允许变化","想法出现时，承认它，再按自己的意愿回来。练习的是安放注意力，不是保证自己一定睡着。"]]],["善待自己与感恩",[["看见不容易","留意今天一件不容易的事，不评判自己应对得好不好。可以说：“难怪我会觉得辛苦。”"],["给一点关怀","如果愿意，把手放在身体舒服的位置。试着说：“今晚，我愿意对自己温柔一点。”不要求立刻平静或积极。"],["记起一个片刻","回想今天一个值得珍惜的普通瞬间，或一件符合自己重视方向的小事。如果感恩让你觉得勉强，就略过，继续善待自己。"]]],["引导式休息",[["让身体被支撑","躺下或坐稳，找到舒适、有支撑的姿势。这类清醒休息练习有时也叫瑜伽休息术，但不能替代睡眠。"],["轻轻移动注意力","依次留意右手、左手、双脚，以及身体与床或椅子接触的位置。闭眼不舒服时，可以睁眼，保留对房间的觉察。"],["不带考核地回来","让注意力在身体和周围声音之间轻轻移动。结束后稍停片刻，再开始活动。不需要感觉“变好了”，这段休息才算数。"]]]],"next":"下一步","previous":"上一步","restart":"重新开始","step":"步骤","breakTitle":"白天也给自己留一点空隙","breakText":"精力和注意力本来就会起伏。任务之间可以短暂停一下：把视线移开、适度伸展、自然呼吸，再看看自己接下来需要什么。不必精确计算90至120分钟的节律，也不需要通过鼻孔通气判断大脑状态。","thoughtsTitle":"给想法一个暂时安放的地方","thoughtsSub":"适合在白天或傍晚使用。夜里想起来时，简单提醒自己就好。","thoughtGuide":[["看见想法，而不是被它拉走","“我注意到，我在想：明天一定撑不住。”加上这句话，是给想法留一点距离，不需要证明它一定是错的。"],["找到更贴近现实的回应","比如：“明天可能会更辛苦，我可以减少一些任务，也可以寻求支持。”选你能相信的表达，不必强迫自己积极。"],["给担忧约个白天的时间","在白天留出10至20分钟，写下困扰和一个可行的小步骤，或承认现在还解决不了的部分。夜里再次想起时，可以说：“这件事很重要，我会在约好的时间再看。”"],["回到在意的生活方向","没睡好后，一整天可能都围着睡眠打转。根据精力调低要求，同时做一件与关系、健康或个人意义有关的小事。"]],"thoughtFields":[["thought","让我睡不踏实的一个想法"],["response","更可信、也更体谅自己的回应"],["worrytime","我给担忧安排的白天时间"],["action","一个可行的小步骤"]],"example":"看看示例","exampleText":["如果今晚睡不好，明天一定全完了。","我可能会累一些。我可以把明天的任务减一点，适当休息，也可以求助。一晚的睡眠不代表全部。"],"dreamsTitle":"从不安的梦里，慢慢回到当下","dreamsSub":"不需要找出梦的“标准含义”，也不必重述所有细节，才能照顾自己。","dreamIntro":"先确认当下：看看四周，说出自己在哪里、今天是哪一天，感受身体下方的支撑，提醒自己“我现在醒着”。需要的话开一盏柔和的灯。先让自己稳下来，再决定要不要继续练习。","dreamSteps":[["温和地选择","在白天选一个你能承受的梦，或只用一句话概括主题。先从不那么强烈的内容开始。也可以完全不写原来的梦。"],["让故事有别的走向","加入安全感、选择、援助，或不同的结局，不必符合现实。可以出现一扇门，可以离开，也可以有人来帮忙。"],["练习新的版本","感觉舒适时，在白天用几分钟想象或读一遍改写后的故事。重点是新版本，而不是反复重温恐怖内容。"],["在支持下观察","留意一段时间内的频率、困扰程度和变化。如果出现闪回、解离、惊恐或更强烈的不适，请停止，重新观察房间，并与了解创伤的专业人员一起进行。反复噩梦值得得到照顾。"]],"dreamFields":[["theme","可选：用一句话概括梦的主题"],["newdream","我的新故事：多一些安全、选择或支持"],["rehearsal","我准备何时、怎样练习"]],"dreamPrompt":"想找一点灵感？","dreamIdeas":["有人来到身边，并愿意陪着我。","我找到一扇门，打开后是安静、安全的地方。","原本可怕的东西变小了，不再能伤害我。","我能说话、能行动，也能选择离开。"],"dreamNote":"梦里的符号没有固定、经过科学验证的标准含义。可以好奇地探索个人联想，但不把梦当成诊断或预言。","morningTitle":"温和地，走进新的一天","morningSub":"刚醒来有些昏沉并不罕见。不必等到完全有精神，才开始一个很小的动作。","morningSteps":[["先觉察","“这里有疲惫，也有担忧。”描述体验，不急着说自己懒惰或没用。"],["轻轻动起来","动动手指、脚趾，做舒适范围内的伸展，或轻轻把脚压向床垫。根据疼痛和行动能力调整。"],["重新连接房间","注意几样看得到、听得到的事物。慢慢坐起；如果头晕，先停一停，持续不适时请就医。"],["双脚落地","安全时，把双脚放到地面，需要的话借助支撑站起。不要滚向床沿或冒着跌倒风险起身。"],["做一件让早晨好过一点的事","选温和的闹铃、拉开窗帘、喝水或吃早餐，也可以放一点音乐。提前给自己留一件值得期待的小事。先保护睡眠时间，不必为了“高效”刻意早起。"]],"diaryTitle":"每天一点点，看见自己的睡眠规律","diarySub":"早晨凭印象记录一次就好，不必半夜看时间。晚间部分用来记录白天的情况。七条记录只是起点；如治疗师需要，可继续记录更长时间。","privacy":"除非你选择“在此设备保存”，输入内容只会保留在当前页面，不会发送到服务器。共用设备上请避免填写姓名或其他身份信息。下载和打印的文件会包含你输入的内容。","remember":"在此设备保存","rememberHint":"可选。关闭后会删除本网站保存在此浏览器中的记录。无痕模式可能无法保留数据。","saved":"已在此设备保存","session":"仅保留在当前页面","saveFailed":"此设备无法保存。内容仍在当前页面，请在关闭前导出。","day":"记录","morningLabel":"晨间估计","eveningLabel":"白天与晚间记录","diaryFields":[["date","记录日期（醒来的这天）","date"],["bed","上床时间","time"],["rise","离床时间","time"],["latency","大约多久入睡（分钟）","number"],["awake","首次入睡后，共清醒多久（含最后醒来到离床，分钟）","number"],["wakes","夜间醒来次数","number"],["quality","睡眠质量（1＝很差，5＝很好）","quality"],["feeling","今早的感觉","text"],["barriers","影响睡眠的因素（想法、疼痛、噪声、梦等）","text"],["naps","前一天午睡或小睡时长（分钟）","number"],["caffeine","咖啡因的摄入量和时间","text"],["exercise","活动或运动时长（分钟）","number"],["meds","药物或其他物质（可不填）","text"],["drowsy","白天的困倦程度","drowsy"],["mood","白天的情绪","text"],["beforebed","睡前一小时做了些什么","text"],["nightmare","噩梦困扰程度（0＝没有，10＝极强）","distress"],["dreamchange","梦境的变化／改写练习（可不填）","text"]],"drowsyOptions":["未记录","没有","有时","经常"],"choose":"未记录","calcNote":"估算适用于24小时以内的一段主要睡眠。卧床时间＝上床至离床；估计睡眠＝卧床时间－入睡所需时间－首次入睡后的清醒时间；睡眠效率＝估计睡眠÷卧床时间×100%。如夜间长时间离床或分段睡眠，请在备注说明，并与专业人员核对。数字不是诊断，也不是要追求的指标。","metricLabels":["卧床时间","估计睡眠","睡眠效率"],"hours":"小时","invalid":"请核对时间和清醒分钟数，两者与这段睡眠不符。","incomplete":"填写上床、离床时间及两项清醒分钟数后即可估算；没有时请填0。","weekTitle":"七条记录概览","weekNote":"只统计信息完整且有效的记录。平均值只描述这份记录，不代表你的睡眠需求。","complete":"条有效记录","emptyDiary":"填写完整记录后，这里会显示你的睡眠趋势。","csv":"导出日记 CSV","clear":"清空我的记录","confirmClear":"确定清空本页面和此设备中的日记、练习及计划吗？清空后无法恢复。","planTitle":"下一步，从一件小事开始","planSub":"为普通、并不完美的一天做一份用得上的计划。改变常常需要几周，一晚没睡好并不等于重新来过。","planFields":[["wake","我能做到的起床时间"],["ritual","我的睡前缓冲安排"],["awakeplan","如果清醒又烦躁，我可以……"],["value","休息好一点后，我想给什么留出空间"],["review","我准备何时与咨询师一起回顾"]],"selectedHabits":"我选择尝试的习惯","noHabits":"可以从上面选一个习惯，也可以写下自己的想法。","roadTitle":"和咨询师一起，循序渐进","road":[["先观察","从睡眠经历、身体状况、用药、情绪和日记开始。也讨论疼痛、打鼾、轮班和照护负担。"],["再调整","挑几项做得到的习惯。适合时，制定刺激控制方案，并讨论专业指导下的睡眠窗口。"],["慢慢练习","学习放松或觉察技巧，梳理对睡眠的预测，把部分担忧留到白天处理。"],["一起回顾","在约6至8周或更长时间里，持续回顾变化。根据生活情况调整，允许起伏，保留真正支持你的部分。"]],"helpTitle":"什么时候值得多一些支持","helpCards":[["需要评估时，及时求助","如果睡眠困难持续、影响日常生活，或伴随疼痛、情绪低落、焦虑、用药变化、频繁夜尿，请与医疗人员讨论。大声打鼾、憋醒、呼吸暂停、腿部难受总想动，或睡梦中出现挥打等动作，也值得评估。"],["先照顾安全","困倦时不要驾车或操作机器。如果睡得很少，却精力异常旺盛、明显激动、思绪飞快或出现冒险行为，请及时寻求紧急医疗建议；有双相障碍病史时尤其如此。"],["药物与补充剂一起核对","不要自行停药或改剂量。褪黑素、镇静类抗组胺药、草药及其他补充剂可能有副作用或相互作用，也不是适合所有失眠的通用方案。请与合格医疗人员讨论。"]],"disclaimer":"本工具供成年人学习和自我观察使用，不用于诊断睡眠障碍，也不能替代个别化的医疗或心理服务。","sourcesTitle":"延伸阅读","sourcesLabels":["美国国立卫生研究院：失眠治疗","美国国立卫生研究院：成人睡眠需求","美国睡眠医学会：失眠的行为治疗","美国睡眠医学会：噩梦治疗","美国国立卫生研究院：睡眠与辅助疗法"],"footer":"由 Mind X社区 开发","footerLink":"https://mindx.us/zh/","printNote":"可在浏览器打印窗口选择“另存为PDF”。已填写的日记、练习和计划会一并包含。","dataNotice":"已准备下载，请妥善保管导出的文件。","habitAnnounce":"计划已更新。","chartLabel":"每条记录的估计睡眠时长（小时）","artLabel":"月光下安静的山丘"},"zh-Hant":{"brand":"慢慢安睡","tag":"給自己一份安睡指南","title":"少一點用力，\n多一點安睡的空間。","intro":"當每晚都變成一場“必須睡好”的考驗，休息也會讓人緊繃。在這裡，從白天、夜晚和醒來的片刻開始，找到適合自己的小改變。","badge":"睡眠 · 休息 · 重新連接","start":"找到適合我的起點","startSub":"現在，你更接近哪種狀態？選一項，看看可以從哪裡開始。這只是使用指引，不是診斷或評估。","concerns":[["腦子停不下來","一到晚上，想法反而更多。","先用想法記錄本把擔憂安放下來，再試試溫和的著陸練習。你不需要今晚就把所有問題解決。","thoughts"],["躺著睡不著","越想趕快睡著，越清醒。","瞭解“用力入睡”的循環，以及怎樣重新建立床與睡眠的聯繫。和咨詢師商量一套方案，避免半夜反復切換方法。","learn"],["噩夢困擾","擔心做噩夢，連睡覺也不踏實。","醒來後先確認自己身在何處，重新感受當下。如果狀態允許，可以在支持下嘗試改寫夢境。","dreams"],["早晨起不來","昏沈、疲憊，或遲遲無法起身。","試試晨間著陸練習：覺察、輕輕活動，再完成一個很小的起床動作。","morning"],["作息不穩定","白天和晚上的節奏有些亂。","先選一個可行的起床時間，再調整一項白天的習慣。觀察一周，不急著大幅改變。","habits"]],"nav":["認識睡眠","日常習慣","安頓身心","梳理想法","夢與噩夢","溫和起床","睡眠日記","我的計劃"],"theme":"深色模式","light":"淺色模式","print":"打印 / PDF","menu":"瀏覽內容","top":"回到頂部","skip":"跳到正文","learnTitle":"先理解睡眠，不急著糾正自己","learnSub":"理解身體怎樣調節睡眠，比給每晚打分更有幫助。","learnCards":[["身體時鐘與睡眠壓力","生物鐘會受到光照和日常作息的影響；睡眠壓力則在清醒時逐漸積累，睡著後慢慢下降。相對穩定的起床時間、白天的自然光和適量活動，有助於兩者配合。"],["一晚並不是一種睡眠","睡眠會在非快速眼動睡眠的淺睡期（N1、N2）、深睡期（N3）和快速眼動睡眠（REM）之間變化。每個週期長短不一，不能按“精確90分鐘”計算。短暫醒來很常見，夢也不只發生在REM期。"],["夠用，比完美更重要","大多數成年人每晚需要約7至9小時睡眠，具體需求因人而異。隨著年齡增長，睡眠可能變淺。除了時長，也關注白天的狀態；即使臥床時間足夠，持續疲憊或頻繁醒來也值得就醫評估。"],["失眠為甚麼會持續","對壓力較敏感可能是基礎；疾病、失落、工作壓力、疼痛或照顧新生兒，可能成為誘因。之後，長時間賴床、擔憂和清醒地躺在床上，可能讓困難持續。這是形成了一個循環，不代表你做得不夠好。"],["越努力，越清醒的循環","一晚沒睡好 → 預想明天一定很糟 → 看時間、強迫入睡 → 更加警覺。試著覺察這個預測，放下與睡眠的較勁，再選擇一個能支持自己的行動。"],["治療能提供甚麼","失眠認知行為治療（CBT-I）結合行為調整和對睡眠想法的梳理，是持續性失眠的一線治療。接納取向的方法可以幫助減少與想法、情緒的糾纏。單靠“睡眠衛生”常常不足以改善慢性失眠。"]],"approachTitle":"躺著睡不著時，可以怎樣做","approach":[["重新建立床與睡眠的聯繫","在CBT-I方案中，有睡意再上床，盡量把床留給睡眠和親密活動。如果明顯清醒或煩躁了大約15至20分鐘，可以到安全、光線柔和的地方做些安靜的事，有睡意後再回床，必要時重復。不必盯著鐘計時。若起身不安全或行動不便，請與治療師一起調整。"],["允許清醒暫時存在","看見一個想法或身體感受，不必馬上反駁或消除它。輕輕感受床墊的支撐，讓呼吸保持自然，給自己一點體諒。休息有助於減少掙扎，但不能替代身體需要的睡眠。如果長時間清醒開始變成煎熬，就使用事先商量好的離床方案。"],["讓方法彼此配合","進行CBT-I時，也可以練習接納，而不必把床變成長時間清醒活動的地方。如果治療師採用另一種接納取向方案，請一起約定何時安靜休息、何時起身。兩種方法都不需要被執行成“必須完美遵守”的規則。"],["睡眠窗口需要專業指導","睡眠限制或壓縮治療，會參考日記，讓臥床時間更貼近實際睡眠，再逐步調整。初期可能更困倦。本工具不會自行開出縮短臥床時間的方案。請在專業人員指導下進行；有雙相障礙、癲癇、疑似睡眠呼吸暫停、明顯嗜睡、孕期或從事高風險工作時，更需要個別評估。困倦時不要駕車。"]],"habitsTitle":"用小習慣，慢慢穩住節奏","habitsSub":"這一周先試一兩項就好。加入你的計劃，不需要追求滿分。","habits":[["給起床時間一個錨點","選擇現實可行的起床時間，週末也盡量接近。沒睡好後，除非專業人員另有建議，盡量避免大幅推遲。也要給自己留出足夠的睡眠機會。"],["早晨接觸自然光","醒來後拉開窗簾，條件允許時到戶外待一會兒。白天的自然光有助於調整生物鐘。使用強光治療設備前，請先咨詢專業人員。"],["白天適度活動","散步、伸展，或做一種你喜歡的活動。如果晚間劇烈運動會讓你興奮，就試著提前。活動量應符合身體狀況和行動能力。"],["留意咖啡因和尼古丁","咖啡因的影響可能持續很多小時。試著把最後一次攝入提前，比如放在午後早些時候，並觀察自己的敏感程度。茶、巧克力、能量飲料和部分藥物也含咖啡因。尼古丁也可能讓人更清醒。"],["酒精及其他物質","酒精可能讓人一開始犯困，卻打斷後半夜的睡眠。盡量不要靠它助眠。若涉及大麻、其他物質或戒斷困擾，請與醫療人員討論。"],["有意識地安排午睡","如果午睡影響夜間睡眠，可以減少或避免。確實需要時，試著控制在約20至30分鐘，並安排在白天較早的時候。安全和個別醫療建議優先。"],["讓睡前一小時慢下來","調暗明亮的燈光，盡可能放下工作、賬單、新聞和困難的對話。試試溫水淋浴、安靜的閱讀或舒緩音樂。屏幕亮度和令人投入的內容，都可能讓大腦保持興奮。"],["讓臥室舒服一點","盡量保持黑暗、安靜和舒適偏涼。必要時使用耳塞、眼罩或輕柔背景聲。選擇有支撐、睡著舒服的寢具，減少打擾。"],["照顧飲食與飲水","如果大餐容易影響入睡或引起反流，盡量別安排在臨睡前。餓了可以吃少量點心。夜間常起床上廁所時，可調整晚間飲水，但不必讓自己缺水。"],["讓床少一點任務感","把工作、刷手機和反復看時間盡量移出床外。不必持續測試“我有沒有睡意”。採用你與咨詢師商量好的方案。"]],"add":"加入我的計劃","added":"已加入計劃","calmTitle":"練習休息，不把入睡當任務","calmSub":"先看一遍，再放下屏幕。你可以隨時停下，也可以全程睜眼。","practices":[["晚間著陸",[["承認此刻的體驗","看看現在有甚麼：擔憂、疲憊、緊張，或不斷冒出的想法。可以說：“這一刻有點難。”不需要清空大腦。"],["感受身體的支撐","感受床墊、枕頭或椅子托住身體的地方。留意自然呼吸帶來的輕微起伏，不必改變它。"],["回到當下","注意一個平常的聲音，或被子的觸感。走神後輕輕回來就好，不必檢查練習“有沒有起效”。"]]],["身體掃描",[["安頓下來","找到有支撐的姿勢，感受身體與下方表面的接觸。睜眼或閉眼，由你決定。"],["逐處覺察","從腳和腿，慢慢移到髖部、雙手、肩膀和臉。注意溫度、壓力、輕微麻感，或沒有明顯感覺，都可以。甚麼都不需要改變。"],["擴大注意範圍","讓注意力輕輕覆蓋全身。如果關注身體讓你不舒服，可以改為觀察房間，或聽一個穩定的聲音。"]]],["溫和的肌肉放鬆",[["做好準備","先在白天練習。跳過疼痛或受傷的部位。保持自然呼吸，不憋氣，也不需要用力。"],["輕輕鬆開","從手或腳開始，輕微繃緊約3至5秒，再松開10至20秒。舒服的話，繼續到腿、肩膀和面部。"],["體會差別","觀察緊與松的區別，不要求徹底放鬆。如果繃緊會疼或增加壓力，只需依次覺察身體，讓感覺暫時存在。"]]],["舒適的呼吸",[["坐穩","舒服地坐著，按自己的節奏輕柔呼吸。不必屏息、用力深呼吸，也不需要數到規定的秒數。"],["可選：交替鼻孔呼吸","鼻腔通暢且感覺舒適時：輕輕閉住右側，從左側吸氣；換邊，從右側呼氣。再從右側吸氣，換邊從左側呼氣。這樣完成一輪，輕鬆重復幾輪即可。普通呼吸也完全可以。"],["結束","恢復自然呼吸。頭暈、鼻塞、氣短或不舒服時立即停止。這只是可選的注意力練習，不是切換左右腦或控制睡眠週期的方法。"]]],["一處安靜的場景",[["選擇場景","想象一個讓你覺得舒服或平和的地方：樹蔭下的小路、熟悉的椅子、一間安靜的房間。不擅長想象時，可以使用文字描述或輕柔的聲音。"],["慢慢感受","留意一些顏色、聲音、質地，或被支撐的感覺。畫面可以很模糊，不必努力構建“完美場景”。"],["允許變化","想法出現時，承認它，再按自己的意願回來。練習的是安放注意力，不是保證自己一定睡著。"]]],["善待自己與感恩",[["看見不容易","留意今天一件不容易的事，不評判自己應對得好不好。可以說：“難怪我會覺得辛苦。”"],["給一點關懷","如果願意，把手放在身體舒服的位置。試著說：“今晚，我願意對自己溫柔一點。”不要求立刻平靜或積極。"],["記起一個片刻","回想今天一個值得珍惜的普通瞬間，或一件符合自己重視方向的小事。如果感恩讓你覺得勉強，就略過，繼續善待自己。"]]],["引導式休息",[["讓身體被支撐","躺下或坐穩，找到舒適、有支撐的姿勢。這類清醒休息練習有時也叫瑜伽休息術，但不能替代睡眠。"],["輕輕移動注意力","依次留意右手、左手、雙腳，以及身體與床或椅子接觸的位置。閉眼不舒服時，可以睜眼，保留對房間的覺察。"],["不帶考核地回來","讓注意力在身體和周圍聲音之間輕輕移動。結束後稍停片刻，再開始活動。不需要感覺“變好了”，這段休息才算數。"]]]],"next":"下一步","previous":"上一步","restart":"重新開始","step":"步驟","breakTitle":"白天也給自己留一點空隙","breakText":"精力和注意力本來就會起伏。任務之間可以短暫停一下：把視線移開、適度伸展、自然呼吸，再看看自己接下來需要甚麼。不必精確計算90至120分鐘的節律，也不需要通過鼻孔通氣判斷大腦狀態。","thoughtsTitle":"給想法一個暫時安放的地方","thoughtsSub":"適合在白天或傍晚使用。夜裡想起來時，簡單提醒自己就好。","thoughtGuide":[["看見想法，而不是被它拉走","“我注意到，我在想：明天一定撐不住。”加上這句話，是給想法留一點距離，不需要證明它一定是錯的。"],["找到更貼近現實的回應","比如：“明天可能會更辛苦，我可以減少一些任務，也可以尋求支持。”選你能相信的表達，不必強迫自己積極。"],["給擔憂約個白天的時間","在白天留出10至20分鐘，寫下困擾和一個可行的小步驟，或承認現在還解決不了的部分。夜裡再次想起時，可以說：“這件事很重要，我會在約好的時間再看。”"],["回到在意的生活方向","沒睡好後，一整天可能都圍著睡眠打轉。根據精力調低要求，同時做一件與關係、健康或個人意義有關的小事。"]],"thoughtFields":[["thought","讓我睡不踏實的一個想法"],["response","更可信、也更體諒自己的回應"],["worrytime","我給擔憂安排的白天時間"],["action","一個可行的小步驟"]],"example":"看看示例","exampleText":["如果今晚睡不好，明天一定全完了。","我可能會累一些。我可以把明天的任務減一點，適當休息，也可以求助。一晚的睡眠不代表全部。"],"dreamsTitle":"從不安的夢里，慢慢回到當下","dreamsSub":"不需要找出夢的“標準含義”，也不必重述所有細節，才能照顧自己。","dreamIntro":"先確認當下：看看四周，說出自己在哪裡、今天是哪一天，感受身體下方的支撐，提醒自己“我現在醒著”。需要的話開一盞柔和的燈。先讓自己穩下來，再決定要不要繼續練習。","dreamSteps":[["溫和地選擇","在白天選一個你能承受的夢，或只用一句話概括主題。先從不那麼強烈的內容開始。也可以完全不寫原來的夢。"],["讓故事有別的走向","加入安全感、選擇、援助，或不同的結局，不必符合現實。可以出現一扇門，可以離開，也可以有人來幫忙。"],["練習新的版本","感覺舒適時，在白天用幾分鐘想象或讀一遍改寫後的故事。重點是新版本，而不是反復重溫恐怖內容。"],["在支持下觀察","留意一段時間內的頻率、困擾程度和變化。如果出現閃回、解離、驚恐或更強烈的不適，請停止，重新觀察房間，並與瞭解創傷的專業人員一起進行。反復噩夢值得得到照顧。"]],"dreamFields":[["theme","可選：用一句話概括夢的主題"],["newdream","我的新故事：多一些安全、選擇或支持"],["rehearsal","我準備何時、怎樣練習"]],"dreamPrompt":"想找一點靈感？","dreamIdeas":["有人來到身邊，並願意陪著我。","我找到一扇門，打開後是安靜、安全的地方。","原本可怕的東西變小了，不再能傷害我。","我能說話、能行動，也能選擇離開。"],"dreamNote":"夢里的符號沒有固定、經過科學驗證的標準含義。可以好奇地探索個人聯想，但不把夢當成診斷或預言。","morningTitle":"溫和地，走進新的一天","morningSub":"剛醒來有些昏沈並不罕見。不必等到完全有精神，才開始一個很小的動作。","morningSteps":[["先覺察","“這裡有疲憊，也有擔憂。”描述體驗，不急著說自己懶惰或沒用。"],["輕輕動起來","動動手指、腳趾，做舒適範圍內的伸展，或輕輕把腳壓向床墊。根據疼痛和行動能力調整。"],["重新連接房間","注意幾樣看得到、聽得到的事物。慢慢坐起；如果頭暈，先停一停，持續不適時請就醫。"],["雙腳落地","安全時，把雙腳放到地面，需要的話借助支撐站起。不要滾向床沿或冒著跌倒風險起身。"],["做一件讓早晨好過一點的事","選溫和的鬧鈴、拉開窗簾、喝水或吃早餐，也可以放一點音樂。提前給自己留一件值得期待的小事。先保護睡眠時間，不必為了“高效”刻意早起。"]],"diaryTitle":"每天一點點，看見自己的睡眠規律","diarySub":"早晨憑印象記錄一次就好，不必半夜看時間。晚間部分用來記錄白天的情況。七條記錄只是起點；如治療師需要，可繼續記錄更長時間。","privacy":"除非你選擇“在此設備保存”，輸入內容只會保留在當前頁面，不會發送到服務器。共用設備上請避免填寫姓名或其他身份信息。下載和打印的文件會包含你輸入的內容。","remember":"在此設備保存","rememberHint":"可選。關閉後會刪除本網站保存在此瀏覽器中的記錄。無痕模式可能無法保留數據。","saved":"已在此設備保存","session":"僅保留在當前頁面","saveFailed":"此設備無法保存。內容仍在當前頁面，請在關閉前導出。","day":"記錄","morningLabel":"晨間估計","eveningLabel":"白天與晚間記錄","diaryFields":[["date","記錄日期（醒來的這天）","date"],["bed","上床時間","time"],["rise","離床時間","time"],["latency","大約多久入睡（分鐘）","number"],["awake","首次入睡後，共清醒多久（含最後醒來到離床，分鐘）","number"],["wakes","夜間醒來次數","number"],["quality","睡眠質量（1＝很差，5＝很好）","quality"],["feeling","今早的感覺","text"],["barriers","影響睡眠的因素（想法、疼痛、噪聲、夢等）","text"],["naps","前一天午睡或小睡時長（分鐘）","number"],["caffeine","咖啡因的攝入量和時間","text"],["exercise","活動或運動時長（分鐘）","number"],["meds","藥物或其他物質（可不填）","text"],["drowsy","白天的困倦程度","drowsy"],["mood","白天的情緒","text"],["beforebed","睡前一小時做了些甚麼","text"],["nightmare","噩夢困擾程度（0＝沒有，10＝極強）","distress"],["dreamchange","夢境的變化／改寫練習（可不填）","text"]],"drowsyOptions":["未記錄","沒有","有時","經常"],"choose":"未記錄","calcNote":"估算適用於24小時以內的一段主要睡眠。臥床時間＝上床至離床；估計睡眠＝臥床時間－入睡所需時間－首次入睡後的清醒時間；睡眠效率＝估計睡眠÷臥床時間×100%。如夜間長時間離床或分段睡眠，請在備注說明，並與專業人員核對。數字不是診斷，也不是要追求的指標。","metricLabels":["臥床時間","估計睡眠","睡眠效率"],"hours":"小時","invalid":"請核對時間和清醒分鐘數，兩者與這段睡眠不符。","incomplete":"填寫上床、離床時間及兩項清醒分鐘數後即可估算；沒有時請填0。","weekTitle":"七條記錄概覽","weekNote":"只統計信息完整且有效的記錄。平均值只描述這份記錄，不代表你的睡眠需求。","complete":"條有效記錄","emptyDiary":"填寫完整記錄後，這裡會顯示你的睡眠趨勢。","csv":"導出日記 CSV","clear":"清空我的記錄","confirmClear":"確定清空本頁面和此設備中的日記、練習及計劃嗎？清空後無法恢復。","planTitle":"下一步，從一件小事開始","planSub":"為普通、並不完美的一天做一份用得上的計劃。改變常常需要幾周，一晚沒睡好並不等於重新來過。","planFields":[["wake","我能做到的起床時間"],["ritual","我的睡前緩衝安排"],["awakeplan","如果清醒又煩躁，我可以……"],["value","休息好一點後，我想給甚麼留出空間"],["review","我準備何時與咨詢師一起回顧"]],"selectedHabits":"我選擇嘗試的習慣","noHabits":"可以從上面選一個習慣，也可以寫下自己的想法。","roadTitle":"和咨詢師一起，循序漸進","road":[["先觀察","從睡眠經歷、身體狀況、用藥、情緒和日記開始。也討論疼痛、打鼾、輪班和照護負擔。"],["再調整","挑幾項做得到的習慣。適合時，制定刺激控制方案，並討論專業指導下的睡眠窗口。"],["慢慢練習","學習放鬆或覺察技巧，梳理對睡眠的預測，把部分擔憂留到白天處理。"],["一起回顧","在約6至8周或更長時間里，持續回顧變化。根據生活情況調整，允許起伏，保留真正支持你的部分。"]],"helpTitle":"甚麼時候值得多一些支持","helpCards":[["需要評估時，及時求助","如果睡眠困難持續、影響日常生活，或伴隨疼痛、情緒低落、焦慮、用藥變化、頻繁夜尿，請與醫療人員討論。大聲打鼾、憋醒、呼吸暫停、腿部難受總想動，或睡夢中出現揮打等動作，也值得評估。"],["先照顧安全","困倦時不要駕車或操作機器。如果睡得很少，卻精力異常旺盛、明顯激動、思緒飛快或出現冒險行為，請及時尋求緊急醫療建議；有雙相障礙病史時尤其如此。"],["藥物與補充劑一起核對","不要自行停藥或改劑量。褪黑素、鎮靜類抗組胺藥、草藥及其他補充劑可能有副作用或相互作用，也不是適合所有失眠的通用方案。請與合格醫療人員討論。"]],"disclaimer":"本工具供成年人學習和自我觀察使用，不用於診斷睡眠障礙，也不能替代個別化的醫療或心理服務。","sourcesTitle":"延伸閱讀","sourcesLabels":["美國國立衛生研究院：失眠治療","美國國立衛生研究院：成人睡眠需求","美國睡眠醫學會：失眠的行為治療","美國睡眠醫學會：噩夢治療","美國國立衛生研究院：睡眠與輔助療法"],"footer":"由 Mind X社區 開發","footerLink":"https://mindx.us/zh/","printNote":"可在瀏覽器打印窗口選擇“另存為PDF”。已填寫的日記、練習和計劃會一並包含。","dataNotice":"已準備下載，請妥善保管導出的文件。","habitAnnounce":"計劃已更新。","chartLabel":"每條記錄的估計睡眠時長（小時）","artLabel":"月光下安靜的山丘"}};
const IS_ZH=true;
const ids=['learn','habits','calm','thoughts','dreams','morning','diary','plan'];
const STORE='mindx-rest-v1';
let language=IS_ZH?'zh-Hans':'en';
let remember=false;
let state={habits:[],fields:{},days:Array.from({length:7},()=>({}))};
let activeDay=0,activePractice=0,activeStep=0,activeConcern=-1;
try{if(IS_ZH&&['zh-Hans','zh-Hant'].includes(localStorage.getItem('rest-language')))language=localStorage.getItem('rest-language');const raw=localStorage.getItem(STORE);if(raw){const v=JSON.parse(raw);if(v&&Array.isArray(v.days)&&v.days.length===7&&v.fields&&Array.isArray(v.habits)){state={days:v.days.map(d=>(d&&typeof d==='object')?d:{}),fields:v.fields,habits:v.habits.filter(n=>Number.isInteger(n)&&n>=0&&n<10)};remember=true}}}catch(e){}
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=()=>DATA[language];
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').hidden=true,3200)}
function persist(){try{if(remember){localStorage.setItem(STORE,JSON.stringify(state));$('#saveStatus').textContent=t().saved}else{$('#saveStatus').textContent=t().session}}catch(e){$('#saveStatus').textContent=t().saveFailed}}
function field(key,label,type='textarea',val='',extra=''){let node;if(type==='textarea')node=`<textarea id="${key}" ${extra}>${esc(val)}</textarea>`;else if(['quality','drowsy','distress'].includes(type)){const options=type==='drowsy'?t().drowsyOptions.map((v,i)=>[['','never','sometimes','often'][i],v]):[['',t().choose],...Array.from({length:type==='quality'?5:11},(_,i)=>{let n=type==='quality'?i+1:i;return[n,n]})];node=`<select id="${key}" ${extra}>${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}else node=`<input id="${key}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" max="1440" step="1"':''} ${extra}>`;return`<label class="field" for="${key}"><span>${esc(label)}</span>${node}<span class="print-value">${esc(type==='drowsy'&&val?t().drowsyOptions[['','never','sometimes','often'].indexOf(val)]||val:val)||'—'}</span></label>`}
function section(id,no,title,sub,body){return `<section class="section" id="${id}"><div class="section-head"><span class="section-no" aria-hidden="true">${no}</span><div><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p></div></div>${body}</section>`}
function cards(data,cols=''){return `<div class="grid ${cols}">${data.map(([h,p],i)=>`<article class="card"><span class="index" aria-hidden="true">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('')}</div>`}
function fields(list){return `<div class="field-grid">${list.map(([key,label])=>field('f-'+key,label,'textarea',state.fields[key]||'',`data-field="${key}"`)).join('')}</div>`}
function render(){const d=t();document.documentElement.lang=language;document.title=d.brand+' | '+d.tag;$('#brand').textContent=d.brand;$('#tag').textContent=d.tag;$('#skip').textContent=d.skip;$('#print').textContent=d.print;$('#toTop').setAttribute('aria-label',d.top);$('#footer').textContent=d.footer;$('#footer').href=d.footerLink;$('#printNote').textContent=d.printNote;$('#nav').setAttribute('aria-label',d.menu);$('#nav').innerHTML=ids.map((id,i)=>`<a href="#${id}">${esc(d.nav[i])}</a>`).join('');
$('#language').hidden=!IS_ZH;if(IS_ZH){$('#language').textContent=language==='zh-Hans'?'繁體中文':'简体中文';$('#language').setAttribute('aria-label',language==='zh-Hans'?'切换至繁體中文':'切換至简体中文')};themeLabel();
$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(d.badge)}</div><h1>${esc(d.title)}</h1><p class="intro">${esc(d.intro)}</p><a class="primary" href="#start">${esc(d.start)} <span aria-hidden="true">↗</span></a></div><div class="art" role="img" aria-label="${esc(d.artLabel)}"><div class="star"></div><div class="moon"></div><div class="hill"></div><div class="hill h2"></div><div class="hill h3"></div><div class="art-label">${esc(d.badge)}</div></div></section>
<section class="starter" id="start"><h2>${esc(d.start)}</h2><p class="sub">${esc(d.startSub)}</p><div class="choice-row">${d.concerns.map((c,i)=>`<button type="button" data-concern="${i}" aria-pressed="${i===activeConcern}">${esc(c[0])}</button>`).join('')}</div><div id="recommend" aria-live="polite"></div></section>
${section('learn','01',d.learnTitle,d.learnSub,cards(d.learnCards)+`<div class="aside"><h3>${esc(d.approachTitle)}</h3>${d.approach.map(([h,p])=>`<details><summary>${esc(h)}</summary><div class="detail">${esc(p)}</div></details>`).join('')}</div>`)}
${section('habits','02',d.habitsTitle,d.habitsSub,`<div class="grid">${d.habits.map(([h,p],i)=>`<article class="card habit ${state.habits.includes(i)?'chosen':''}" id="habit-${i}"><span class="index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><h3>${esc(h)}</h3><p>${esc(p)}</p><button type="button" data-habit="${i}" aria-pressed="${state.habits.includes(i)}">${state.habits.includes(i)?'✓ '+esc(d.added):'+ '+esc(d.add)}</button></article>`).join('')}</div>`)}
${section('calm','03',d.calmTitle,d.calmSub,`<div class="tabs" role="tablist" aria-label="${esc(d.nav[2])}">${d.practices.map(([h],i)=>`<button type="button" role="tab" id="practice-tab-${i}" data-practice="${i}" aria-controls="practice-panel" aria-selected="${i===activePractice}" tabindex="${i===activePractice?0:-1}">${esc(h)}</button>`).join('')}</div><div id="practice-panel" class="practice" role="tabpanel" tabindex="0"></div><div class="print-only">${d.practices.map(([h,steps])=>`<article class="print-practice"><h3>${esc(h)}</h3>${steps.map(([a,b])=>`<h4>${esc(a)}</h4><p>${esc(b)}</p>`).join('')}</article>`).join('')}</div><aside class="aside"><h3>${esc(d.breakTitle)}</h3><p>${esc(d.breakText)}</p></aside>`)}
${section('thoughts','04',d.thoughtsTitle,d.thoughtsSub,cards(d.thoughtGuide,'two')+`<div class="form-card"><div class="inline-actions"><button class="text-button" id="example" type="button">${esc(d.example)}</button></div><p id="exampleView" class="quiet" hidden></p>${fields(d.thoughtFields)}</div>`)}
${section('dreams','05',d.dreamsTitle,d.dreamsSub,`<aside class="aside" style="margin-top:0;margin-bottom:24px"><p>${esc(d.dreamIntro)}</p></aside>`+cards(d.dreamSteps,'two')+`<div class="form-card"><div class="inline-actions"><button id="dreamIdea" class="text-button" type="button">${esc(d.dreamPrompt)}</button></div><p id="dreamIdeaView" class="quiet" aria-live="polite" hidden></p>${fields(d.dreamFields)}</div><p class="quiet" style="margin-top:20px">${esc(d.dreamNote)}</p>`)}
${section('morning','06',d.morningTitle,d.morningSub,`<div class="grid">${d.morningSteps.map(([h,p],i)=>`<article class="card"><span class="index" aria-hidden="true">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join('')}</div>`)}
${section('diary','07',d.diaryTitle,d.diarySub,`<div class="privacy">${esc(d.privacy)}</div><div class="save-row"><label class="check-label"><input type="checkbox" id="remember" ${remember?'checked':''}>${esc(d.remember)}</label><span class="save-status" id="saveStatus" role="status">${esc(remember?d.saved:d.session)}</span></div><p class="quiet remember-hint">${esc(d.rememberHint)}</p><div class="tabs day-tabs" role="tablist" aria-label="${esc(d.nav[6])}">${Array.from({length:7},(_,i)=>`<button type="button" role="tab" id="day-tab-${i}" data-day="${i}" aria-controls="day-${i}" aria-label="${esc(d.day)} ${i+1}" aria-selected="${i===activeDay}" tabindex="${i===activeDay?0:-1}">${i+1}</button>`).join('')}</div><div id="diaryPanels">${state.days.map((v,i)=>diaryPanel(v,i)).join('')}</div><p class="quiet" style="margin-top:18px">${esc(d.calcNote)}</p><div id="snapshot" class="snapshot"></div><div class="inline-actions"><button type="button" id="csv">${esc(d.csv)}</button><button type="button" id="clear" class="text-button">${esc(d.clear)}</button></div>`)}
${section('plan','08',d.planTitle,d.planSub,`<div class="form-card"><h3>${esc(d.selectedHabits)}</h3><div id="habitList"></div>${fields(d.planFields)}</div><aside style="margin-top:38px"><h3>${esc(d.roadTitle)}</h3><div class="road">${d.road.map(([h,p])=>`<article><h4>${esc(h)}</h4><p>${esc(p)}</p></article>`).join('')}</div></aside><div class="help"><h2>${esc(d.helpTitle)}</h2>${cards(d.helpCards)}<p class="disclaimer">${esc(d.disclaimer)}</p><details class="resources"><summary>${esc(d.sourcesTitle)}</summary><div class="detail sources">${['https://www.nhlbi.nih.gov/health/insomnia/treatment','https://www.nhlbi.nih.gov/health/sleep/how-much-sleep','https://pmc.ncbi.nlm.nih.gov/articles/PMC7853203/','https://pmc.ncbi.nlm.nih.gov/articles/PMC5991964/','https://www.nccih.nih.gov/health/sleep-disorders-and-complementary-health-approaches'].map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">${esc(d.sourcesLabels[i])} ↗</a>`).join('')}</div></details></div>`)}
`;
renderConcern();renderPractice();renderHabits();state.days.forEach((_,i)=>renderMetrics(i));renderSnapshot();bind();}
function diaryPanel(v,i){const d=t();return `<div id="day-${i}" class="diary-card" role="tabpanel" aria-labelledby="day-tab-${i}" tabindex="0" ${i!==activeDay?'hidden':''}><h3>${esc(d.day)} ${i+1}</h3><div class="group-heading">${esc(d.morningLabel)}</div><div class="field-grid">${d.diaryFields.slice(0,9).map(([k,l,type])=>field('d'+i+'-'+k,l,type,v[k]??'',`data-dayfield="${k}" data-entry="${i}"`)).join('')}</div><div id="metrics-${i}"></div><div class="group-heading">${esc(d.eveningLabel)}</div><div class="field-grid">${d.diaryFields.slice(9).map(([k,l,type])=>field('d'+i+'-'+k,l,type,v[k]??'',`data-dayfield="${k}" data-entry="${i}"`)).join('')}</div></div>`}
function calc(v){if(!v.bed||!v.rise||v.latency==null||v.latency===''||v.awake==null||v.awake==='')return {kind:'incomplete'};const time=s=>{if(!/^\d{2}:\d{2}$/.test(s))return NaN;let [h,m]=s.split(':').map(Number);return h<24&&m<60?h*60+m:NaN};let bed=time(v.bed),rise=time(v.rise),inbed=(rise-bed+1440)%1440,latency=Number(v.latency),awake=Number(v.awake);if(!Number.isFinite(inbed)||inbed===0||!Number.isFinite(latency)||!Number.isFinite(awake)||latency<0||awake<0||latency+awake>inbed)return {kind:'invalid'};const sleep=inbed-latency-awake;return{kind:'valid',inbed,sleep,eff:sleep/inbed*100}}
function metricHTML(m){const d=t();return`<div class="metrics">${d.metricLabels.map((l,i)=>`<div class="metric"><strong>${m&&m.kind==='valid'?(i===0?(m.inbed/60).toFixed(1)+' '+d.hours:i===1?(m.sleep/60).toFixed(1)+' '+d.hours:m.eff.toFixed(0)+'%'):'—'}</strong><span>${esc(l)}</span></div>`).join('')}</div>`}
function renderMetrics(i){const m=calc(state.days[i]),el=$('#metrics-'+i);if(el)el.innerHTML=metricHTML(m)+(m.kind!=='valid'?`<p class="calc-message ${m.kind==='invalid'?'error':''}" role="status">${esc(t()[m.kind])}</p>`:'')}
function renderSnapshot(){const d=t(),all=state.days.map(calc),valid=all.filter(m=>m.kind==='valid');let m=null;if(valid.length){const inbed=valid.reduce((a,v)=>a+v.inbed,0),sleep=valid.reduce((a,v)=>a+v.sleep,0);m={kind:'valid',inbed:inbed/valid.length,sleep:sleep/valid.length,eff:sleep/inbed*100}}const max=Math.max(9,...valid.map(v=>v.sleep/60));$('#snapshot').innerHTML=`<h3>${esc(d.weekTitle)}</h3><p class="quiet">${esc(d.weekNote)}</p><p class="quiet">${valid.length} / 7 ${esc(d.complete)}</p>${valid.length?metricHTML(m):`<p class="quiet">${esc(d.emptyDiary)}</p>`}<div class="bars" role="img" aria-label="${esc(d.chartLabel+': '+all.map((m,i)=>(i+1)+' = '+(m.kind==='valid'?(m.sleep/60).toFixed(1):'—')).join(', '))}">${all.map((m,i)=>`<div class="bar-wrap"><span class="bar-value">${m.kind==='valid'?(m.sleep/60).toFixed(1):'—'}</span><div class="bar" style="height:${m.kind==='valid'?Math.max(1,m.sleep/60/max*85):1}%"></div><span class="bar-label">${i+1}</span></div>`).join('')}</div>`}
function renderHabits(){const d=t();$('#habitList').innerHTML=state.habits.length?`<ul class="habit-list">${state.habits.map(i=>`<li>${esc(d.habits[i][0])}</li>`).join('')}</ul>`:`<p class="quiet">${esc(d.noHabits)}</p>`}
function renderConcern(){const c=t().concerns[activeConcern];$('#recommend').innerHTML=c?`<div class="recommend"><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><a href="#${c[3]}">${esc(t().nav[ids.indexOf(c[3])])} ↗</a></div>`:''}
function renderPractice(){const d=t(),p=d.practices[activePractice],s=p[1][activeStep];$('#practice-panel').setAttribute('aria-labelledby','practice-tab-'+activePractice);$('#practice-panel').innerHTML=`<div class="practice-art" aria-hidden="true"></div><div><p class="step-num">${esc(d.step)} ${activeStep+1} / ${p[1].length}</p><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p><div class="step-actions"><button type="button" id="previous" ${activeStep===0?'disabled':''}>← ${esc(d.previous)}</button><button type="button" id="next">${esc(activeStep===p[1].length-1?d.restart:d.next)} ${activeStep===p[1].length-1?'↺':'→'}</button></div></div>`;$('#previous').onclick=()=>{activeStep=Math.max(0,activeStep-1);renderPractice();$('#practice-panel').focus()};$('#next').onclick=()=>{activeStep=(activeStep+1)%p[1].length;renderPractice();$('#practice-panel').focus()}}
function themeLabel(){let dark=document.documentElement.dataset.theme==='dark';$('#theme').textContent=dark?'☀ '+t().light:'☾ '+t().theme;$('#theme').setAttribute('aria-pressed',String(dark))}
function updateMirror(el){el.parentElement.querySelector('.print-value').textContent=(el.tagName==='SELECT'?el.selectedOptions[0]?.textContent:el.value)||'—'}
function tabKeys(selector,attr,activate){const list=$$(selector);list.forEach((b,i)=>b.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%list.length;else if(e.key==='ArrowLeft')n=(i+list.length-1)%list.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=list.length-1;else return;e.preventDefault();activate(Number(list[n].getAttribute(attr)));list[n].focus()}))}
function setPractice(n){activePractice=n;activeStep=0;$$('[data-practice]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===n));b.tabIndex=i===n?0:-1});renderPractice()}
function setDay(n){activeDay=n;$$('[data-day]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===n));b.tabIndex=i===n?0:-1;$('#day-'+i).hidden=i!==n})}
function bind(){$$('[data-concern]').forEach(b=>b.onclick=()=>{activeConcern=Number(b.dataset.concern);$$('[data-concern]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderConcern()});$$('[data-habit]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.habit),selected=state.habits.includes(i);state.habits=selected?state.habits.filter(n=>n!==i):[...state.habits,i];b.setAttribute('aria-pressed',String(!selected));b.textContent=!selected?'✓ '+t().added:'+ '+t().add;b.closest('.habit').classList.toggle('chosen',!selected);renderHabits();persist();notify(t().habitAnnounce)});$$('[data-practice]').forEach(b=>b.onclick=()=>setPractice(Number(b.dataset.practice)));tabKeys('[data-practice]','data-practice',setPractice);$$('[data-day]').forEach(b=>b.onclick=()=>setDay(Number(b.dataset.day)));tabKeys('[data-day]','data-day',setDay);$$('[data-field]').forEach(el=>el.oninput=()=>{state.fields[el.dataset.field]=el.value;updateMirror(el);persist()});$$('[data-dayfield]').forEach(el=>{const changed=()=>{const i=Number(el.dataset.entry);state.days[i][el.dataset.dayfield]=el.value;updateMirror(el);renderMetrics(i);renderSnapshot();persist()};el.addEventListener('input',changed);el.addEventListener('change',changed)});$('#remember').onchange=e=>{remember=e.target.checked;if(!remember){try{localStorage.removeItem(STORE)}catch(e){$('#saveStatus').textContent=t().saveFailed;return}}persist()};$('#example').onclick=()=>{const p=$('#exampleView');p.hidden=!p.hidden;p.textContent=t().exampleText.join(' → ')};let idea=0;$('#dreamIdea').onclick=()=>{const p=$('#dreamIdeaView');p.hidden=false;p.textContent=t().dreamIdeas[idea++%t().dreamIdeas.length]};$('#csv').onclick=exportCSV;$('#clear').onclick=()=>{if(!confirm(t().confirmClear))return;state={habits:[],fields:{},days:Array.from({length:7},()=>({}))};try{localStorage.removeItem(STORE)}catch(e){}remember=false;render()}}
function exportCSV(){const d=t();const keys=d.diaryFields.map(f=>f[0]),headers=d.diaryFields.map(f=>f[1]);headers.push(d.metricLabels[0]+' ('+d.hours+')',d.metricLabels[1]+' ('+d.hours+')',d.metricLabels[2]+' (%)');const rows=state.days.map(v=>{const m=calc(v);return[...keys.map(k=>k==='drowsy'&&v[k]?d.drowsyOptions[['','never','sometimes','often'].indexOf(v[k])]||v[k]:v[k]??''),...(m.kind==='valid'?[(m.inbed/60).toFixed(2),(m.sleep/60).toFixed(2),m.eff.toFixed(1)]:['','',''])]});const safe=v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\uFEFF'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='sleep-diary.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(d.dataNotice)}
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('rest-theme',dark?'dark':'light')}catch(e){}themeLabel()};$('#language').onclick=()=>{const y=scrollY;language=language==='zh-Hans'?'zh-Hant':'zh-Hans';try{localStorage.setItem('rest-language',language)}catch(e){}render();window.scrollTo({top:y,behavior:'instant'});$('#language').focus({preventScroll:true})};$('#toTop').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
let printDetails=[];function preparePrint(){printDetails=$$('details').map(el=>[el,el.open]);printDetails.forEach(([el])=>el.open=true)}function afterPrint(){printDetails.forEach(([el,open])=>el.open=open);printDetails=[]}window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',afterPrint);$('#print').onclick=()=>window.print();
render();
</script></body></html>
